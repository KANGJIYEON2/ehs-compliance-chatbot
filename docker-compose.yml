services:
  # ── PostgreSQL ──
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ehs
      POSTGRES_USER: ehs
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ehs_secret_2024}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ehs"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──
  api:
    build: ./packages/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - EHS_DATABASE_URL=postgresql://ehs:${DB_PASSWORD:-ehs_secret_2024}@db:5432/ehs
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LAW_API_KEY=${LAW_API_KEY:-}
      - CORS_ORIGINS=https://safety-ai.team-ieum.com,http://safety-ai.team-ieum.com
      - PORT=8000
      - WORKERS=2
    volumes:
      - ./packages/api/vector_db_law:/app/vector_db_law:ro
      - ./packages/api/vector_db_rule:/app/vector_db_rule:ro
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default
      - susemi_internal

  # ── Admin Web (React) ──
  admin:
    build:
      context: ./apps/admin
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - default
      - susemi_internal

  # ── Worker PWA (React) ──
  worker:
    build:
      context: ./apps/worker
      args:
        VITE_API_URL: ""
        VITE_BASE_PATH: "/worker"
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - default
      - susemi_internal

volumes:
  pgdata:
  uploads:

networks:
  susemi_internal:
    external: true
