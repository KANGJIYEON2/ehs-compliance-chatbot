upstream api {
    server api:8000;
}

upstream admin {
    server admin:80;
}

upstream worker {
    server worker:80;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 25M;

    # API — /api/, /health, /ask, /reload-db, /static
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://api;
    }

    location /ask {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location /reload-db {
        proxy_pass http://api;
    }

    location /static/ {
        proxy_pass http://api;
    }

    # Worker PWA — /worker/
    location /worker/ {
        proxy_pass http://worker/;
        proxy_set_header Host $host;
    }

    # Admin — everything else (default)
    location / {
        proxy_pass http://admin;
        proxy_set_header Host $host;
    }

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
